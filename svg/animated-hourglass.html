<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated SVG Object (300x300)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
    }
    .container {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    svg {
      width: 300px;
      height: 300px;
      display: block;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #e2e8f0;
    }
    p {
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 300 x 300 Animated SVG -->
    <svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Background Glow Gradient -->
        <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
        </radialGradient>

        <!-- Sand Gradient -->
        <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fde047" />
          <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>

        <!-- Frame Metallic Gradient -->
        <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#cbd5e1" />
          <stop offset="50%" stop-color="#f8fafc" />
          <stop offset="100%" stop-color="#94a3b8" />
        </linearGradient>

        <!-- Clip paths for top and bottom glass bulbs -->
        <clipPath id="topBulbClip">
          <path d="M 102 72 L 198 72 C 198 112, 162 135, 150 150 C 138 135, 102 112, 102 72 Z" />
        </clipPath>

        <clipPath id="bottomBulbClip">
          <path d="M 150 150 C 162 165, 198 188, 198 228 L 102 228 C 102 188, 138 165, 150 150 Z" />
        </clipPath>
      </defs>

      <!-- Ambient Background Circle -->
      <circle cx="150" cy="150" r="135" fill="url(#bgGlow)" />

      <!-- Outer Rotating Dashed Chrono Ring -->
      <g>
        <circle
          cx="150"
          cy="150"
          r="118"
          fill="none"
          stroke="#38bdf8"
          stroke-width="2.5"
          stroke-dasharray="14 10 4 10"
          opacity="0.7"
        />
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 150 150"
          to="360 150 150"
          dur="18s"
          repeatCount="indefinite"
        />
      </g>

      <!-- Inner Counter-Rotating Ring -->
      <g>
        <circle
          cx="150"
          cy="150"
          r="104"
          fill="none"
          stroke="#818cf8"
          stroke-width="1.5"
          stroke-dasharray="6 14"
          opacity="0.6"
        />
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="360 150 150"
          to="0 150 150"
          dur="12s"
          repeatCount="indefinite"
        />
      </g>

      <!-- Top Sand (Draining Animation) -->
      <g clip-path="url(#topBulbClip)">
        <rect x="95" y="85" width="110" height="70" fill="url(#sandGrad)">
          <animate
            attributeName="y"
            values="85; 148; 85"
            keyTimes="0; 0.85; 1"
            dur="5s"
            repeatCount="indefinite"
          />
        </rect>
      </g>

      <!-- Falling Sand Stream -->
      <line
        x1="150"
        y1="148"
        x2="150"
        y2="226"
        stroke="#fde047"
        stroke-width="3"
        stroke-dasharray="6 4"
      >
        <animate
          attributeName="stroke-dashoffset"
          from="20"
          to="0"
          dur="0.6s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="opacity"
          values="1; 1; 0; 0"
          keyTimes="0; 0.8; 0.86; 1"
          dur="5s"
          repeatCount="indefinite"
        />
      </line>

      <!-- Bottom Sand (Filling Animation) -->
      <g clip-path="url(#bottomBulbClip)">
        <rect x="95" y="228" width="110" height="75" fill="url(#sandGrad)">
          <animate
            attributeName="y"
            values="228; 178; 228"
            keyTimes="0; 0.85; 1"
            dur="5s"
            repeatCount="indefinite"
          />
        </rect>
      </g>

      <!-- Glass Outline & Specular Highlight -->
      <path
        d="M 102 72 L 198 72 C 198 112, 162 135, 150 150 C 162 165, 198 188, 198 228 L 102 228 C 102 188, 138 165, 150 150 C 138 135, 102 112, 102 72 Z"
        fill="#e0f2fe"
        fill-opacity="0.12"
        stroke="#bae6fd"
        stroke-width="3"
      />
      <path
        d="M 114 82 C 114 106, 134 124, 143 138"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-linecap="round"
        opacity="0.55"
      />

      <!-- Top & Bottom Caps -->
      <rect x="90" y="60" width="120" height="12" rx="6" fill="url(#frameGrad)" />
      <rect x="90" y="228" width="120" height="12" rx="6" fill="url(#frameGrad)" />

      <!-- Pulsing Orbiting Spark Particles -->
      <circle cx="150" cy="32" r="4" fill="#38bdf8">
        <animate attributeName="r" values="3; 5.5; 3" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="150" cy="268" r="4" fill="#fbbf24">
        <animate attributeName="r" values="5.5; 3; 5.5" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1; 0.5; 1" dur="2s" repeatCount="indefinite" />
      </circle>
    </svg>

    <h1>Chrono Hourglass (300&times;300 SVG)</h1>
    <p>Animated with native SVG &lt;animate&gt; and &lt;animateTransform&gt;</p>
  </div>
</body>
</html>
